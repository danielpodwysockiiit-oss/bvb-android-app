<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BVB Live App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header class="header">
    <h1>BVB LIVE APP</h1>
  </header>

  <main class="container">
    <!-- Push Benachrichtigungen Button -->
    <button id="notif-btn" class="notif-btn">🔔 Push-Benachrichtigungen aktivieren</button>

    <!-- Live Match Section -->
    <section id="live-card" class="card live-card hidden">
      <span class="live-tag">🔴 LIVE SPIEL</span>
      <h2 id="live-teams" class="match-title"></h2>
      <div id="live-score" class="big-score">0 : 0</div>
      <h3>Tore / Torschützen:</h3>
      <div id="live-goals" class="goals-list"></div>
    </section>

    <!-- Tabellenplatz Card -->
    <section class="card">
      <h2>Aktueller Tabellenplatz</h2>
      <div id="bvb-rank" class="big-text">--. Platz</div>
      <p id="bvb-stats" class="sub-text">Lade Daten...</p>
    </section>

    <!-- Nächstes Spiel Card -->
    <section class="card">
      <h2>Nächstes Spiel & Gegner</h2>
      <div class="opponent-container">
        <img id="opponent-logo" class="team-logo hidden" alt="Gegner Logo">
        <div>
          <span class="opponent-label">Gegner:</span>
          <div id="opponent-name" class="opponent-name">--</div>
        </div>
      </div>
      <p id="next-match-teams" class="match-text"></p>
      <p id="next-match-date" class="sub-text"></p>
    </section>

    <!-- Letzte Spiele Card -->
    <section class="card">
      <h2>Letzte Spiele</h2>
      <div id="last-matches" class="history-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
